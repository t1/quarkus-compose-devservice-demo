name: demo
services:
  s3:
    image: pgsty/silo
    ports:
      - "127.0.0.1:9000-9999:9000"
      - "127.0.0.1:9000-9999:9001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MINIO_ROOT_USER: 'admin'
      MINIO_ROOT_PASSWORD: '12345678' # minio min len is 8 chars
      MINIO_NOTIFY_WEBHOOK_ENABLE: "on"
      MINIO_NOTIFY_WEBHOOK_ENDPOINT: "http://host.docker.internal:${APP_PORT:-8080}/s3/events"
    labels:
      io.quarkus.devservices.compose.config_map.env.MINIO_ROOT_USER: s3.username
      io.quarkus.devservices.compose.config_map.env.MINIO_ROOT_PASSWORD: s3.password
      io.quarkus.devservices.compose.config_map.port.9000: s3.port
      io.quarkus.devservices.compose.config_map.port.9001: s3.ui-port
    command: server /data --console-address ":9001"
